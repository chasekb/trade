version: '3.8'

services:
  # C++ Backend Service (New)
  cpp-backend:
    image: ${CPP_BACKEND_IMAGE:-ghcr.io/chasekb/trade/cpp-backend:dev}
    ports:
      - "${CPP_BACKEND_HOST_PORT:-8081}:8080"
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=redis://redis:6379
      - ENV=development
      - TRAINED_MODELS_DIR=/app/data/trained_models
    dns:
      # Keep Podman's network-local resolver first for db/redis service names,
      # then fall back to public DNS for external providers such as Coinbase.
      - 10.89.3.1
      - 1.1.1.1
      - 8.8.8.8
    user: "0:0"
    volumes:
      - ./.env:/app/.env:ro,Z
      - ./data/cpp_assets:/app/data/cpp_assets:ro,Z
      - ./data/onnx:/app/data/onnx:U,Z
      - trade-trained-models:/app/data/trained_models
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - trading-network
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/bin/bash -c 'exec 3<>/dev/tcp/127.0.0.1/8080; printf \"GET /health HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n\" >&3; grep -q healthy <&3'",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # Frontend Service (Next.js TypeScript)
  frontend:
    image: ${FRONTEND_IMAGE:-ghcr.io/chasekb/trade/frontend:dev}
    ports:
      - "3000:3000"
    environment:
      - HOSTNAME=0.0.0.0
      - BACKEND_URL=http://cpp-backend:8080
      - NEXT_PUBLIC_API_URL=http://cpp-backend:8080
      - NEXT_PUBLIC_WS_URL=ws://cpp-backend:8080
      - NEXT_PUBLIC_NODE_ENV=production
      - NEXT_PUBLIC_APP_VERSION=1.0.0
    depends_on:
      cpp-backend:
        condition: service_healthy
    networks:
      - trading-network
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "(command -v curl >/dev/null 2>&1 && curl -fsS http://127.0.0.1:3000/api/health >/dev/null) || (command -v wget >/dev/null 2>&1 && wget -q -O- http://127.0.0.1:3000/api/health >/dev/null)",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # Main Database
  db:
    image: docker.io/library/postgres:15-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ./data/databases/postgres:/var/lib/postgresql/data:Z
    ports:
      # Keep the host binding configurable so this stack can coexist with
      # another local PostgreSQL service. Containers still use db:5432.
      - "${POSTGRES_HOST_PORT:-5433}:5432"
    networks:
      - trading-network
    restart: unless-stopped
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}" ]
      interval: 30s
      timeout: 10s
      retries: 3

  # Cache Service
  redis:
    image: docker.io/library/redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - ./data/cache/redis:/data:Z
    networks:
      - trading-network
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 30s
      timeout: 10s
      retries: 3


networks:
  trading-network:
    driver: bridge

volumes:
  trade-trained-models:
