version: '3.8'

services:
  # C++ Backend Service (New)
  cpp-backend:
    image: ${CPP_BACKEND_IMAGE:-ghcr.io/chasekb/trade/cpp-backend:dev}
    platform: ${CPP_BACKEND_PLATFORM:-linux/amd64}
    build:
      context: .
      dockerfile: Dockerfile.cpp
    ports:
      - "${CPP_BACKEND_HOST_PORT:-8081}:8080"
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=redis://redis:6379
      - QDRANT_URL=http://qdrant:6333
      - ENV=development
      - TRAINED_MODELS_DIR=/app/data/trained_models
    volumes:
      - ./.env:/app/.env:ro
      - ./data/cpp_assets:/app/data/cpp_assets:ro
      - ./data/onnx:/app/data/onnx:ro
      - ./data/trained_models:/app/data/trained_models
    depends_on:
      - db
      - redis
      - qdrant
    networks:
      - trading-network
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "(command -v curl >/dev/null 2>&1 && curl -fsS http://localhost:8080/health >/dev/null) || (command -v wget >/dev/null 2>&1 && wget -q -O- http://localhost:8080/health >/dev/null)",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # Frontend Service (Next.js TypeScript)
  frontend:
    image: ghcr.io/chasekb/trade/frontend:${TAG:-latest}
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - BACKEND_URL=http://cpp-backend:8080
      - NEXT_PUBLIC_API_URL=http://cpp-backend:8080
      - NEXT_PUBLIC_WS_URL=ws://cpp-backend:8080
      - NEXT_PUBLIC_NODE_ENV=production
      - NEXT_PUBLIC_APP_VERSION=1.0.0
    depends_on:
      - cpp-backend
    networks:
      - trading-network
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "(command -v curl >/dev/null 2>&1 && curl -fsS http://localhost:3000/api/health >/dev/null) || (command -v wget >/dev/null 2>&1 && wget -q -O- http://localhost:3000/api/health >/dev/null)",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # Vector Database for ML Features
  qdrant:
    image: ghcr.io/chasekb/trade/qdrant:${TAG:-latest}
    build:
      context: .
      dockerfile: qdrant.Dockerfile
    ports:
      - "${QDRANT_HOST_PORT:-16333}:6333"
      - "${QDRANT_GRPC_HOST_PORT:-16334}:6334"
    volumes:
      - qdrant_storage:/qdrant/storage
    networks:
      - trading-network
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:6333/healthz" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # Main Database
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - trading-network
    restart: unless-stopped
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}" ]
      interval: 30s
      timeout: 10s
      retries: 3

  # Cache Service
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - trading-network
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  postgres_data:
  redis_data:
  qdrant_storage:


networks:
  trading-network:
    driver: bridge
