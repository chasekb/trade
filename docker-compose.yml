version: '3.8'

services:
  # C++ Backend Service (New)
  cpp-backend:
    image: ${CPP_BACKEND_IMAGE:-ghcr.io/chasekb/trade/cpp-backend:dev}
    platform: ${CPP_BACKEND_PLATFORM:-linux/amd64}
    ports:
      - "${CPP_BACKEND_HOST_PORT:-8081}:8080"
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=redis://redis:6379
      - ENV=development
      - TRAINED_MODELS_DIR=/app/data/trained_models
    user: "0:0"
    volumes:
      - ./.env:/app/.env:ro,Z
      - ./data/cpp_assets:/app/data/cpp_assets:ro,Z
      - ./data/onnx:/app/data/onnx:U,Z
      - trade-trained-models:/app/data/trained_models
    depends_on:
      - db
      - redis
    networks:
      - trading-network
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "(command -v curl >/dev/null 2>&1 && curl -fsS http://localhost:8080/health >/dev/null) || (command -v wget >/dev/null 2>&1 && wget -q -O- http://localhost:8080/health >/dev/null)",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # Frontend Service (Next.js TypeScript)
  frontend:
    image: ${FRONTEND_IMAGE:-ghcr.io/chasekb/trade/frontend:dev}
    ports:
      - "3000:3000"
    environment:
      - BACKEND_URL=http://cpp-backend:8080
      - NEXT_PUBLIC_API_URL=http://cpp-backend:8080
      - NEXT_PUBLIC_WS_URL=ws://cpp-backend:8080
      - NEXT_PUBLIC_NODE_ENV=production
      - NEXT_PUBLIC_APP_VERSION=1.0.0
    depends_on:
      - cpp-backend
    networks:
      - trading-network
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "(command -v curl >/dev/null 2>&1 && curl -fsS http://localhost:3000/api/health >/dev/null) || (command -v wget >/dev/null 2>&1 && wget -q -O- http://localhost:3000/api/health >/dev/null)",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # Main Database
  db:
    image: docker.io/library/postgres:15-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ./data/databases/postgres:/var/lib/postgresql/data:Z
    ports:
      - "5432:5432"
    networks:
      - trading-network
    restart: unless-stopped
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}" ]
      interval: 30s
      timeout: 10s
      retries: 3

  # Cache Service
  redis:
    image: docker.io/library/redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - ./data/cache/redis:/data:Z
    networks:
      - trading-network
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 30s
      timeout: 10s
      retries: 3


networks:
  trading-network:
    driver: bridge

volumes:
  trade-trained-models:
