version: '3.8'

services:
  cpp-test:
    build:
      context: .
      dockerfile: Dockerfile.cpp
    volumes:
      - .:/app:z
      - ./data:/app/data:z
    environment:
      - ENV=test
    command: >
      bash -c "mkdir -p build && 
               cmake -S . -B build -DCMAKE_TOOLCHAIN_FILE=/opt/vcpkg/scripts/buildsystems/vcpkg.cmake -DCMAKE_BUILD_TYPE=Debug && 
               cmake --build build --target test_feature_engineer -j$(nproc) && 
               ./build/test_feature_engineer"
    networks:
      - trading-network

networks:
  trading-network:
    driver: bridge
