version: '3.8'

services:
  cpp-test:
    # Pin to the same overridable, CI-published tag convention as
    # docker-compose.yml instead of a floating `:latest` so a given run is
    # reproducible and tied to a known build (override via CPP_BACKEND_IMAGE).
    image: ${CPP_BACKEND_IMAGE:-ghcr.io/chasekb/trade/cpp-backend:dev}
    volumes:
      - .:/app:z
      - ./data:/app/data:z
    environment:
      - ENV=test
    command: >
      bash -c "mkdir -p build && 
               cmake -S . -B build -DCMAKE_TOOLCHAIN_FILE=/opt/vcpkg/scripts/buildsystems/vcpkg.cmake -DCMAKE_BUILD_TYPE=Debug && 
               cmake --build build --target test_feature_engineer -j$(nproc) && 
               ./build/test_feature_engineer"
    networks:
      - trading-network

networks:
  trading-network:
    driver: bridge
