<!DOCTYPE html>
<html>
<head>
    <script src="https://cdn.plot.ly/plotly-latest.min.js"></script>
</head>
<body>
    <div id="test-chart" style="height: 400px;"></div>
    <script>
        // Test data similar to what we get from the API
        const testData = [
            {
                "timestamp": "2025-09-12T08:00:00Z",
                "open": 115114,
                "high": 115290.17,
                "low": 114813.42,
                "close": 115200.02,
                "volume": 181.23304195
            },
            {
                "timestamp": "2025-09-12T09:00:00Z",
                "open": 115200.02,
                "high": 115535.88,
                "low": 114876,
                "close": 115321.73,
                "volume": 442.1703969
            }
        ];
        
        // Process data like in the dashboard
        const times = testData.map(candle => new Date(candle.timestamp));
        const opens = testData.map(candle => parseFloat(candle.open));
        const highs = testData.map(candle => parseFloat(candle.high));
        const lows = testData.map(candle => parseFloat(candle.low));
        const closes = testData.map(candle => parseFloat(candle.close));
        const volumes = testData.map(candle => parseFloat(candle.volume));
        
        console.log('Test data processed:', {times, opens, highs, lows, closes, volumes});
        
        // Create candlestick trace
        const candlestickTrace = {
            x: times,
            open: opens,
            high: highs,
            low: lows,
            close: closes,
            type: 'candlestick',
            name: 'Price',
            increasing: { line: { color: '#10B981' } },
            decreasing: { line: { color: '#EF4444' } }
        };
        
        const layout = {
            title: 'Test Candlestick Chart',
            xaxis: { title: 'Time' },
            yaxis: { title: 'Price (USD)' }
        };
        
        Plotly.newPlot('test-chart', [candlestickTrace], layout, {responsive: true});
    </script>
</body>
</html>
