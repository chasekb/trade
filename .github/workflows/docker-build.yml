name: Docker Build Validation

on:
  push:
    branches: [ "main", "dev" ]
  pull_request:
    branches: [ "main", "dev" ]
  workflow_dispatch:

jobs:
  build-cpp:
    name: Build C++ Backend (${{ matrix.suffix }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
            suffix: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            suffix: arm64

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build C++ Backend (${{ matrix.suffix }})
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.cpp
          platforms: ${{ matrix.platform }}
          push: false
          cache-from: type=gha,scope=cpp-${{ matrix.suffix }}
          cache-to: type=gha,mode=max,scope=cpp-${{ matrix.suffix }}

  build-frontend:
    name: Build Frontend (${{ matrix.suffix }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
            suffix: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            suffix: arm64

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Frontend (${{ matrix.suffix }})
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          platforms: ${{ matrix.platform }}
          push: false
          cache-from: type=gha,scope=frontend-${{ matrix.suffix }}
          cache-to: type=gha,mode=max,scope=frontend-${{ matrix.suffix }}



  build-qdrant:
    name: Build Qdrant (${{ matrix.suffix }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
            suffix: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            suffix: arm64
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build Qdrant (${{ matrix.suffix }})
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./qdrant.Dockerfile
          platforms: ${{ matrix.platform }}
          push: false
          cache-from: type=gha,scope=qdrant-${{ matrix.suffix }}
          cache-to: type=gha,mode=max,scope=qdrant-${{ matrix.suffix }}


