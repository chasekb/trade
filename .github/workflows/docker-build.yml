name: Docker Build and Push

on:
  push:
    branches: [ "main", "dev" ]
  pull_request:
    branches: [ "main", "dev" ]

jobs:
  build-cpp:
    name: Build C++ Backend (${{ matrix.suffix }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
            suffix: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            suffix: arm64

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push C++ Backend (${{ matrix.suffix }})
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.cpp
          platforms: ${{ matrix.platform }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ghcr.io/${{ github.repository }}/cpp-backend:latest-${{ matrix.suffix }}
          cache-from: type=gha,scope=cpp-${{ matrix.suffix }}
          cache-to: type=gha,mode=max,scope=cpp-${{ matrix.suffix }}

  merge-cpp-manifest:
    name: Merge C++ Backend Manifest
    needs: build-cpp
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create and push multi-arch manifest for C++ Backend
        run: |
          docker buildx imagetools create \
            --tag ghcr.io/${{ github.repository }}/cpp-backend:latest \
            --tag ghcr.io/${{ github.repository }}/cpp-backend:${{ github.ref_name }} \
            ghcr.io/${{ github.repository }}/cpp-backend:latest-amd64 \
            ghcr.io/${{ github.repository }}/cpp-backend:latest-arm64

  build-frontend:
    name: Build Frontend (${{ matrix.suffix }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
            suffix: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            suffix: arm64

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Frontend (${{ matrix.suffix }})
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          platforms: ${{ matrix.platform }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ghcr.io/${{ github.repository }}/frontend:latest-${{ matrix.suffix }}
          cache-from: type=gha,scope=frontend-${{ matrix.suffix }}
          cache-to: type=gha,mode=max,scope=frontend-${{ matrix.suffix }}

  merge-frontend-manifest:
    name: Merge Frontend Manifest
    needs: build-frontend
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create and push multi-arch manifest for Frontend
        run: |
          docker buildx imagetools create \
            --tag ghcr.io/${{ github.repository }}/frontend:latest \
            --tag ghcr.io/${{ github.repository }}/frontend:${{ github.ref_name }} \
            ghcr.io/${{ github.repository }}/frontend:latest-amd64 \
            ghcr.io/${{ github.repository }}/frontend:latest-arm64
