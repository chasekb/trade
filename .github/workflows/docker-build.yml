name: Docker Build Validation

on:
  push:
    branches: [ "main", "dev" ]
  pull_request:
    branches: [ "main", "dev" ]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io/chasekb/trade

jobs:
  build-cpp:
    name: Build C++ Backend (${{ matrix.arch }})
    runs-on: ${{ matrix.runs_on }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON((github.event_name == 'pull_request') && '[{"platform":"linux/amd64","arch":"amd64","runs_on":"ubuntu-latest"}]' || '[{"platform":"linux/amd64","arch":"amd64","runs_on":"ubuntu-latest"},{"platform":"linux/arm64","arch":"arm64","runs_on":"self-hosted-arm64"}]') }}
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        if: matrix.runs_on == 'ubuntu-latest'
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build C++ Backend
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.cpp
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ env.REGISTRY }}/cpp-backend,push-by-digest=true,name-canonical=true,push=${{ github.event_name != 'pull_request' }}
          cache-from: type=gha,scope=cpp-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=cpp-${{ matrix.arch }}

      - name: Export digest
        if: github.event_name != 'pull_request'
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: digests-cpp-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge-cpp:
    name: Publish C++ Backend manifest
    if: github.event_name != 'pull_request'
    needs: build-cpp
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: /tmp/digests/cpp
          pattern: digests-cpp-*
          merge-multiple: true

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Create manifest list and push
        working-directory: /tmp/digests/cpp
        run: |
          docker buildx imagetools create \
            -t ${{ env.REGISTRY }}/cpp-backend:${{ github.ref_name }} \
            -t ${{ env.REGISTRY }}/cpp-backend:sha-${{ github.sha }} \
            $(printf '${{ env.REGISTRY }}/cpp-backend@sha256:%s ' *)

  build-frontend:
    name: Build Frontend (${{ matrix.arch }})
    runs-on: ${{ matrix.runs_on }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON((github.event_name == 'pull_request') && '[{"platform":"linux/amd64","arch":"amd64","runs_on":"ubuntu-latest"}]' || '[{"platform":"linux/amd64","arch":"amd64","runs_on":"ubuntu-latest"},{"platform":"linux/arm64","arch":"arm64","runs_on":"self-hosted-arm64"}]') }}
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        if: matrix.runs_on == 'ubuntu-latest'
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Frontend
        id: build
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ env.REGISTRY }}/frontend,push-by-digest=true,name-canonical=true,push=${{ github.event_name != 'pull_request' }}
          cache-from: type=gha,scope=frontend-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=frontend-${{ matrix.arch }}

      - name: Export digest
        if: github.event_name != 'pull_request'
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: digests-frontend-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge-frontend:
    name: Publish Frontend manifest
    if: github.event_name != 'pull_request'
    needs: build-frontend
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: /tmp/digests/frontend
          pattern: digests-frontend-*
          merge-multiple: true

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Create manifest list and push
        working-directory: /tmp/digests/frontend
        run: |
          docker buildx imagetools create \
            -t ${{ env.REGISTRY }}/frontend:${{ github.ref_name }} \
            -t ${{ env.REGISTRY }}/frontend:sha-${{ github.sha }} \
            $(printf '${{ env.REGISTRY }}/frontend@sha256:%s ' *)

  build-qdrant:
    name: Build Qdrant (${{ matrix.arch }})
    runs-on: ${{ matrix.runs_on }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON((github.event_name == 'pull_request') && '[{"platform":"linux/amd64","arch":"amd64","runs_on":"ubuntu-latest"}]' || '[{"platform":"linux/amd64","arch":"amd64","runs_on":"ubuntu-latest"},{"platform":"linux/arm64","arch":"arm64","runs_on":"self-hosted-arm64"}]') }}
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        if: matrix.runs_on == 'ubuntu-latest'
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Qdrant
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./qdrant.Dockerfile
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ env.REGISTRY }}/qdrant,push-by-digest=true,name-canonical=true,push=${{ github.event_name != 'pull_request' }}
          cache-from: type=gha,scope=qdrant-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=qdrant-${{ matrix.arch }}

      - name: Export digest
        if: github.event_name != 'pull_request'
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: digests-qdrant-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge-qdrant:
    name: Publish Qdrant manifest
    if: github.event_name != 'pull_request'
    needs: build-qdrant
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: /tmp/digests/qdrant
          pattern: digests-qdrant-*
          merge-multiple: true

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Create manifest list and push
        working-directory: /tmp/digests/qdrant
        run: |
          docker buildx imagetools create \
            -t ${{ env.REGISTRY }}/qdrant:${{ github.ref_name }} \
            -t ${{ env.REGISTRY }}/qdrant:sha-${{ github.sha }} \
            $(printf '${{ env.REGISTRY }}/qdrant@sha256:%s ' *)


