name: Docker Build Validation

on:
  push:
    branches: [ "main", "dev" ]
  pull_request:
    branches: [ "main", "dev" ]
  workflow_dispatch:

concurrency:
  group: docker-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  REGISTRY: ghcr.io/chasekb/trade

jobs:
  build-cpp:
    name: Build C++ Backend (${{ matrix.arch }})
    runs-on: ${{ matrix.runs_on }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON((github.event_name == 'pull_request') && '[{"platform":"linux/amd64","arch":"amd64","runs_on":"ubuntu-latest"}]' || '[{"platform":"linux/amd64","arch":"amd64","runs_on":"ubuntu-latest"},{"platform":"linux/arm64","arch":"arm64","runs_on":"ubuntu-24.04-arm"}]') }}
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5; do
            if timeout 60s bash -lc 'echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin'; then
              exit 0
            fi
            echo "ghcr.io login attempt ${attempt} failed, retrying..."
            sleep $((attempt * 5))
          done
          echo "Failed to log in to ghcr.io after multiple attempts"
          exit 1

      - name: Set up QEMU
        if: matrix.runs_on == 'ubuntu-latest'
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build C++ Backend
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.cpp
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ env.REGISTRY }}/cpp-backend,push-by-digest=true,name-canonical=true,push=${{ github.event_name != 'pull_request' }}
          # C++ builds already compile and test successfully before image push,
          # but gha cache export can fail afterward with BuildKit `not_found`
          # missing-blob errors and incorrectly fail the delivery run. Keep the
          # remote build deterministic by avoiding the external cache blob store.
          no-cache: true

      - name: Export digest
        if: github.event_name != 'pull_request'
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: digests-cpp-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge-cpp:
    name: Publish C++ Backend manifest
    if: github.event_name != 'pull_request'
    needs: build-cpp
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: /tmp/digests/cpp
          pattern: digests-cpp-*
          merge-multiple: true

      - name: Log in to GitHub Container Registry
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5; do
            if timeout 60s bash -lc 'echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin'; then
              exit 0
            fi
            echo "ghcr.io login attempt ${attempt} failed, retrying..."
            sleep $((attempt * 5))
          done
          echo "Failed to log in to ghcr.io after multiple attempts"
          exit 1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Guard branch tag freshness
        id: freshness
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" != "push" ]; then
            echo "publish_branch_tag=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          remote_sha="$(git ls-remote https://github.com/${{ github.repository }}.git "refs/heads/${{ github.ref_name }}" | cut -f1)"
          if [ -n "$remote_sha" ] && [ "$remote_sha" = "${{ github.sha }}" ]; then
            echo "publish_branch_tag=true" >> "$GITHUB_OUTPUT"
          else
            echo "publish_branch_tag=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create immutable commit manifest tag
        working-directory: /tmp/digests/cpp
        run: |
          docker buildx imagetools create \
            -t ${{ env.REGISTRY }}/cpp-backend:sha-${{ github.sha }} \
            $(printf '${{ env.REGISTRY }}/cpp-backend@sha256:%s ' *)

      - name: Update branch tag to latest branch HEAD
        if: steps.freshness.outputs.publish_branch_tag == 'true'
        run: |
          docker buildx imagetools create \
            -t ${{ env.REGISTRY }}/cpp-backend:${{ github.ref_name }} \
            ${{ env.REGISTRY }}/cpp-backend:sha-${{ github.sha }}

  build-frontend:
    name: Build Frontend (${{ matrix.arch }})
    runs-on: ${{ matrix.runs_on }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON((github.event_name == 'pull_request') && '[{"platform":"linux/amd64","arch":"amd64","runs_on":"ubuntu-latest"}]' || '[{"platform":"linux/amd64","arch":"amd64","runs_on":"ubuntu-latest"},{"platform":"linux/arm64","arch":"arm64","runs_on":"ubuntu-latest"}]') }}
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5; do
            if timeout 60s bash -lc 'echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin'; then
              exit 0
            fi
            echo "ghcr.io login attempt ${attempt} failed, retrying..."
            sleep $((attempt * 5))
          done
          echo "Failed to log in to ghcr.io after multiple attempts"
          exit 1

      - name: Set up QEMU
        if: matrix.runs_on == 'ubuntu-latest'
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Frontend
        id: build
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ env.REGISTRY }}/frontend,push-by-digest=true,name-canonical=true,push=${{ github.event_name != 'pull_request' }}
          # Frontend build cache has been intermittently failing on GH Actions
          # with missing blob errors during the final image assembly step.
          # Disable gha cache import/export here so the image build stays
          # deterministic and does not depend on the external cache blob store.
          no-cache: true

      - name: Export digest
        if: github.event_name != 'pull_request'
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: digests-frontend-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge-frontend:
    name: Publish Frontend manifest
    if: github.event_name != 'pull_request'
    needs: build-frontend
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: /tmp/digests/frontend
          pattern: digests-frontend-*
          merge-multiple: true

      - name: Log in to GitHub Container Registry
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5; do
            if timeout 60s bash -lc 'echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin'; then
              exit 0
            fi
            echo "ghcr.io login attempt ${attempt} failed, retrying..."
            sleep $((attempt * 5))
          done
          echo "Failed to log in to ghcr.io after multiple attempts"
          exit 1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Guard branch tag freshness
        id: freshness
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" != "push" ]; then
            echo "publish_branch_tag=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          remote_sha="$(git ls-remote https://github.com/${{ github.repository }}.git "refs/heads/${{ github.ref_name }}" | cut -f1)"
          if [ -n "$remote_sha" ] && [ "$remote_sha" = "${{ github.sha }}" ]; then
            echo "publish_branch_tag=true" >> "$GITHUB_OUTPUT"
          else
            echo "publish_branch_tag=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create immutable commit manifest tag
        working-directory: /tmp/digests/frontend
        run: |
          docker buildx imagetools create \
            -t ${{ env.REGISTRY }}/frontend:sha-${{ github.sha }} \
            $(printf '${{ env.REGISTRY }}/frontend@sha256:%s ' *)

      - name: Update branch tag to latest branch HEAD
        if: steps.freshness.outputs.publish_branch_tag == 'true'
        run: |
          docker buildx imagetools create \
            -t ${{ env.REGISTRY }}/frontend:${{ github.ref_name }} \
            ${{ env.REGISTRY }}/frontend:sha-${{ github.sha }}
