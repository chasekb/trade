name: Docker Build Validation

on:
  push:
    branches: [ "main", "dev", "wt/**" ]
  pull_request:
    branches: [ "main", "dev" ]
  workflow_dispatch:

concurrency:
  group: docker-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  REGISTRY: ghcr.io/chasekb/trade

jobs:
  build-cpp:
    name: Build C++ Backend (${{ matrix.arch }})
    runs-on: ${{ matrix.runs_on }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON((github.event_name == 'pull_request') && '[{"platform":"linux/amd64","arch":"amd64","runs_on":"ubuntu-latest"}]' || '[{"platform":"linux/amd64","arch":"amd64","runs_on":"ubuntu-latest"},{"platform":"linux/arm64","arch":"arm64","runs_on":"ubuntu-24.04-arm"}]') }}
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5; do
            if timeout 60s bash -lc 'echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin'; then
              exit 0
            fi
            echo "ghcr.io login attempt ${attempt} failed, retrying..."
            sleep $((attempt * 5))
          done
          echo "Failed to log in to ghcr.io after multiple attempts"
          exit 1

      - name: Set up QEMU
        if: matrix.runs_on == 'ubuntu-latest'
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build C++ Backend
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.cpp
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ env.REGISTRY }}/cpp-backend,push-by-digest=true,name-canonical=true,push=${{ github.event_name != 'pull_request' }}
          # NuGet-backed vcpkg binary cache on GitHub Packages for the
          # remaining vcpkg ports (see Dockerfile.cpp). The token is passed
          # as a BuildKit secret, never a build arg, so it can't leak into
          # an image layer; readwrite is restricted to push events (a
          # forked PR's GITHUB_TOKEN has no package-write permission
          # regardless), matching the same restriction already used for
          # image push above.
          build-args: |
            GITHUB_REPOSITORY_OWNER=${{ github.repository_owner }}
            GITHUB_REPOSITORY=${{ github.repository }}
            VCPKG_NUGET_READWRITE=${{ github.event_name != 'pull_request' }}
          secrets: |
            github_token=${{ secrets.GITHUB_TOKEN }}
          # gha cache export used to fail after a successful build/push with
          # BuildKit `not_found` missing-blob errors, incorrectly failing an
          # otherwise-successful run — no-cache:true worked around that by
          # disabling caching entirely. ignore-error=true (merged upstream
          # 2026-09-14) tolerates that transient export failure instead of
          # papering over it by never caching, so unchanged layers (the
          # vcpkg/toolchain setup in particular, the single largest
          # contributor to this job's wall time) can be reused across runs.
          # Scoped per architecture since amd64/arm64 build in separate jobs.
          cache-from: type=gha,scope=cpp-backend-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=cpp-backend-${{ matrix.arch }},ignore-error=true

      - name: Export digest
        if: github.event_name != 'pull_request'
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: digests-cpp-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge-cpp:
    name: Publish C++ Backend manifest
    if: github.event_name != 'pull_request'
    needs: build-cpp
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: /tmp/digests/cpp
          pattern: digests-cpp-*
          merge-multiple: true

      - name: Log in to GitHub Container Registry
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5; do
            if timeout 60s bash -lc 'echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin'; then
              exit 0
            fi
            echo "ghcr.io login attempt ${attempt} failed, retrying..."
            sleep $((attempt * 5))
          done
          echo "Failed to log in to ghcr.io after multiple attempts"
          exit 1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Guard branch tag freshness
        id: freshness
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" != "push" ]; then
            echo "publish_branch_tag=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          remote_sha="$(git ls-remote https://github.com/${{ github.repository }}.git "refs/heads/${{ github.ref_name }}" | cut -f1)"
          if [ -n "$remote_sha" ] && [ "$remote_sha" = "${{ github.sha }}" ]; then
            echo "publish_branch_tag=true" >> "$GITHUB_OUTPUT"
          else
            echo "publish_branch_tag=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create immutable commit manifest tag
        working-directory: /tmp/digests/cpp
        run: |
          docker buildx imagetools create \
            -t ${{ env.REGISTRY }}/cpp-backend:sha-${{ github.sha }} \
            $(printf '${{ env.REGISTRY }}/cpp-backend@sha256:%s ' *)

      - name: Update branch tag to latest branch HEAD
        if: steps.freshness.outputs.publish_branch_tag == 'true'
        run: |
          set -euo pipefail
          safe_ref="${GITHUB_REF_NAME//\//-}"
          docker buildx imagetools create \
            -t ${{ env.REGISTRY }}/cpp-backend:${safe_ref} \
            ${{ env.REGISTRY }}/cpp-backend:sha-${{ github.sha }}

  build-frontend:
    name: Build Frontend (${{ matrix.arch }})
    runs-on: ${{ matrix.runs_on }}
    strategy:
      fail-fast: false
      matrix:
        # Use a native ARM runner for push-time frontend arm64 images; QEMU
        # Buildx repeatedly hit the 6h Actions cancellation limit here.
        include: ${{ fromJSON((github.event_name == 'pull_request') && '[{"platform":"linux/amd64","arch":"amd64","runs_on":"ubuntu-latest"}]' || '[{"platform":"linux/amd64","arch":"amd64","runs_on":"ubuntu-latest"},{"platform":"linux/arm64","arch":"arm64","runs_on":"ubuntu-24.04-arm"}]') }}
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5; do
            if timeout 60s bash -lc 'echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin'; then
              exit 0
            fi
            echo "ghcr.io login attempt ${attempt} failed, retrying..."
            sleep $((attempt * 5))
          done
          echo "Failed to log in to ghcr.io after multiple attempts"
          exit 1

      - name: Set up QEMU
        if: matrix.runs_on == 'ubuntu-latest'
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Frontend
        id: build
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ env.REGISTRY }}/frontend,push-by-digest=true,name-canonical=true,push=${{ github.event_name != 'pull_request' }}
          # See the C++ backend build step: gha cache export's missing-blob
          # failures are now tolerated via ignore-error=true (merged upstream
          # 2026-09-14) instead of worked around by disabling caching outright.
          cache-from: type=gha,scope=frontend-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=frontend-${{ matrix.arch }},ignore-error=true

      - name: Export digest
        if: github.event_name != 'pull_request'
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: digests-frontend-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge-frontend:
    name: Publish Frontend manifest
    if: github.event_name != 'pull_request'
    needs: build-frontend
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: /tmp/digests/frontend
          pattern: digests-frontend-*
          merge-multiple: true

      - name: Log in to GitHub Container Registry
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5; do
            if timeout 60s bash -lc 'echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin'; then
              exit 0
            fi
            echo "ghcr.io login attempt ${attempt} failed, retrying..."
            sleep $((attempt * 5))
          done
          echo "Failed to log in to ghcr.io after multiple attempts"
          exit 1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Guard branch tag freshness
        id: freshness
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" != "push" ]; then
            echo "publish_branch_tag=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          remote_sha="$(git ls-remote https://github.com/${{ github.repository }}.git "refs/heads/${{ github.ref_name }}" | cut -f1)"
          if [ -n "$remote_sha" ] && [ "$remote_sha" = "${{ github.sha }}" ]; then
            echo "publish_branch_tag=true" >> "$GITHUB_OUTPUT"
          else
            echo "publish_branch_tag=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create immutable commit manifest tag
        working-directory: /tmp/digests/frontend
        run: |
          docker buildx imagetools create \
            -t ${{ env.REGISTRY }}/frontend:sha-${{ github.sha }} \
            $(printf '${{ env.REGISTRY }}/frontend@sha256:%s ' *)

      - name: Update branch tag to latest branch HEAD
        if: steps.freshness.outputs.publish_branch_tag == 'true'
        run: |
          set -euo pipefail
          safe_ref="${GITHUB_REF_NAME//\//-}"
          docker buildx imagetools create \
            -t ${{ env.REGISTRY }}/frontend:${safe_ref} \
            ${{ env.REGISTRY }}/frontend:sha-${{ github.sha }}
