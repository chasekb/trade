<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Frontend Stats Validation Test</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .test-section { margin: 20px 0; padding: 15px; border: 1px solid #ccc; }
        .test-result { margin: 10px 0; padding: 10px; }
        .pass { background-color: #d4edda; color: #155724; }
        .fail { background-color: #f8d7da; color: #721c24; }
        .test-data { background-color: #f8f9fa; padding: 10px; margin: 10px 0; }
        pre { white-space: pre-wrap; }
    </style>
</head>
<body>
    <h1>Frontend Simulated Trading Stats Validation</h1>
    
    <div class="test-section">
        <h2>Test Data</h2>
        <div class="test-data">
            <pre id="test-data-display"></pre>
        </div>
    </div>
    
    <div class="test-section">
        <h2>Frontend Calculations</h2>
        <div id="frontend-calculations"></div>
    </div>
    
    <div class="test-section">
        <h2>Expected Results</h2>
        <div id="expected-results"></div>
    </div>
    
    <div class="test-section">
        <h2>Test Results</h2>
        <div id="test-results"></div>
    </div>

    <script>
        // Test data (matching the backend test)
        const testPortfolioData = {
            trades: [
                { trade_id: "1", symbol: "BTC-USD", side: "buy", quantity: 0.1, price: 50000.0, pnl: 500.0, fees: 25.0 },
                { trade_id: "2", symbol: "ETH-USD", side: "buy", quantity: 1.0, price: 3000.0, pnl: -200.0, fees: 15.0 },
                { trade_id: "3", symbol: "BTC-USD", side: "sell", quantity: 0.05, price: 55000.0, pnl: 250.0, fees: 13.75 },
                { trade_id: "4", symbol: "ADA-USD", side: "buy", quantity: 1000.0, price: 0.5, pnl: 100.0, fees: 0.25 }
            ],
            positions: {
                "BTC-USD": { symbol: "BTC-USD", side: "long", quantity: 0.05, status: "open", unrealized_pnl: 250.0 },
                "ETH-USD": { symbol: "ETH-USD", side: "long", quantity: 1.0, status: "open", unrealized_pnl: -200.0 }
            },
            total_pnl: 650.0,
            total_fees: 54.0,
            total_value: 13550.0,
            cash_balance: 8000.0,
            max_drawdown: 0.15
        };

        // Frontend calculation function (copied from dashboard_enhanced.js)
        function calculateSimulatedTradingStats(portfolioData) {
            if (!portfolioData) return null;
            
            const trades = portfolioData.trades || [];
            const positions = portfolioData.positions || {};
            
            // Calculate trade-based metrics
            const winningTrades = trades.filter(trade => trade.pnl > 0);
            const losingTrades = trades.filter(trade => trade.pnl < 0);
            const totalTrades = trades.length;
            const winningTradesCount = winningTrades.length;
            const losingTradesCount = losingTrades.length;
            
            // Calculate P&L metrics
            const totalPnl = portfolioData.total_pnl || 0;
            const totalFees = portfolioData.total_fees || 0;
            const netPnl = totalPnl - totalFees;
            
            // Calculate win rate
            const winRate = totalTrades > 0 ? (winningTradesCount / totalTrades) * 100 : 0;
            
            // Calculate trade size metrics
            const totalTradeVolume = trades.reduce((sum, trade) => sum + (trade.quantity * trade.price), 0);
            const avgTradeSize = totalTrades > 0 ? totalTradeVolume / totalTrades : 0;
            
            // Calculate best/worst trades
            const bestTrade = trades.length > 0 ? Math.max(...trades.map(t => t.pnl || 0)) : 0;
            const worstTrade = trades.length > 0 ? Math.min(...trades.map(t => t.pnl || 0)) : 0;
            
            // Calculate average win/loss
            const avgWin = winningTradesCount > 0 ? winningTrades.reduce((sum, trade) => sum + trade.pnl, 0) / winningTradesCount : 0;
            const avgLoss = losingTradesCount > 0 ? losingTrades.reduce((sum, trade) => sum + trade.pnl, 0) / losingTradesCount : 0;
            
            // Calculate profit factor
            const grossProfit = winningTrades.reduce((sum, trade) => sum + trade.pnl, 0);
            const grossLoss = Math.abs(losingTrades.reduce((sum, trade) => sum + trade.pnl, 0));
            const profitFactor = grossLoss > 0 ? grossProfit / grossLoss : (grossProfit > 0 ? Infinity : 0);
            
            // Count active positions
            const activePositions = Object.values(positions).filter(pos => pos.status === 'open').length;
            
            return {
                totalPnl: totalPnl,
                netPnl: netPnl,
                totalTrades: totalTrades,
                winningTrades: winningTradesCount,
                losingTrades: losingTradesCount,
                activePositions: activePositions,
                totalValue: portfolioData.total_value || 0,
                totalTradeVolume: totalTradeVolume,
                cashBalance: portfolioData.cash_balance || 0,
                maxDrawdown: portfolioData.max_drawdown || 0,
                winRate: winRate,
                totalFees: totalFees,
                avgTradeSize: avgTradeSize,
                bestTrade: bestTrade,
                worstTrade: worstTrade,
                avgWin: avgWin,
                avgLoss: avgLoss,
                profitFactor: profitFactor
            };
        }

        // Expected results
        const expectedResults = {
            totalTrades: 4,
            winningTrades: 3,
            losingTrades: 1,
            winRate: 75.0,
            totalPnl: 650.0,
            totalFees: 54.0,
            netPnl: 596.0,
            totalTradeVolume: 11250.0,
            avgTradeSize: 2812.5,
            bestTrade: 500.0,
            worstTrade: -200.0,
            avgWin: 283.33,
            avgLoss: -200.0,
            profitFactor: 4.25,
            activePositions: 2
        };

        // Run tests
        function runTests() {
            const calculatedStats = calculateSimulatedTradingStats(testPortfolioData);
            
            // Display test data
            document.getElementById('test-data-display').textContent = JSON.stringify(testPortfolioData, null, 2);
            
            // Display frontend calculations
            document.getElementById('frontend-calculations').innerHTML = `
                <pre>${JSON.stringify(calculatedStats, null, 2)}</pre>
            `;
            
            // Display expected results
            document.getElementById('expected-results').innerHTML = `
                <pre>${JSON.stringify(expectedResults, null, 2)}</pre>
            `;
            
            // Run validation tests
            const tests = [
                { name: 'Total Trades', actual: calculatedStats.totalTrades, expected: expectedResults.totalTrades },
                { name: 'Winning Trades', actual: calculatedStats.winningTrades, expected: expectedResults.winningTrades },
                { name: 'Losing Trades', actual: calculatedStats.losingTrades, expected: expectedResults.losingTrades },
                { name: 'Win Rate', actual: calculatedStats.winRate, expected: expectedResults.winRate },
                { name: 'Total P&L', actual: calculatedStats.totalPnl, expected: expectedResults.totalPnl },
                { name: 'Total Fees', actual: calculatedStats.totalFees, expected: expectedResults.totalFees },
                { name: 'Net P&L', actual: calculatedStats.netPnl, expected: expectedResults.netPnl },
                { name: 'Total Trade Volume', actual: calculatedStats.totalTradeVolume, expected: expectedResults.totalTradeVolume },
                { name: 'Average Trade Size', actual: calculatedStats.avgTradeSize, expected: expectedResults.avgTradeSize },
                { name: 'Best Trade', actual: calculatedStats.bestTrade, expected: expectedResults.bestTrade },
                { name: 'Worst Trade', actual: calculatedStats.worstTrade, expected: expectedResults.worstTrade },
                { name: 'Average Win', actual: Math.round(calculatedStats.avgWin * 100) / 100, expected: expectedResults.avgWin },
                { name: 'Average Loss', actual: calculatedStats.avgLoss, expected: expectedResults.avgLoss },
                { name: 'Profit Factor', actual: Math.round(calculatedStats.profitFactor * 100) / 100, expected: expectedResults.profitFactor },
                { name: 'Active Positions', actual: calculatedStats.activePositions, expected: expectedResults.activePositions }
            ];
            
            let testResultsHtml = '';
            let allPassed = true;
            
            tests.forEach(test => {
                const passed = test.actual === test.expected;
                if (!passed) allPassed = false;
                
                testResultsHtml += `
                    <div class="test-result ${passed ? 'pass' : 'fail'}">
                        <strong>${test.name}:</strong> 
                        ${passed ? 'PASS' : 'FAIL'} 
                        (Expected: ${test.expected}, Got: ${test.actual})
                    </div>
                `;
            });
            
            document.getElementById('test-results').innerHTML = testResultsHtml;
            
            // Overall result
            const overallResult = document.createElement('div');
            overallResult.className = `test-result ${allPassed ? 'pass' : 'fail'}`;
            overallResult.innerHTML = `<strong>Overall Result: ${allPassed ? 'ALL TESTS PASSED' : 'SOME TESTS FAILED'}</strong>`;
            document.getElementById('test-results').appendChild(overallResult);
        }

        // Run tests when page loads
        window.onload = runTests;
    </script>
</body>
</html>
