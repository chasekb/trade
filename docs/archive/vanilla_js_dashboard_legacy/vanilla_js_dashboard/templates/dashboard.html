<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trading Dashboard</title>
    <script src="https://cdn.plot.ly/plotly-latest.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        .gradient-bg {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
        .card-hover {
            transition: transform 0.2s ease-in-out;
        }
        .card-hover:hover {
            transform: translateY(-2px);
        }
        .pulse-animation {
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
    </style>
</head>
<body class="bg-gray-100 min-h-screen">
    <!-- Navigation -->
    <nav class="gradient-bg shadow-lg">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16">
                <div class="flex items-center">
                    <i class="fas fa-chart-line text-white text-2xl mr-3"></i>
                    <h1 class="text-white text-xl font-bold">Trading Dashboard</h1>
                </div>
                <div class="flex items-center space-x-4">
                    <span class="text-white text-sm" id="connection-status">
                        <i class="fas fa-circle text-red-500 mr-2"></i>Connecting...
                    </span>
                    <span class="text-white text-sm" id="last-update">Never</span>
                </div>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
        <!-- Real-time Data Section -->
        <div class="grid grid-cols-1 lg:grid-cols-4 gap-6 mb-8">
            <!-- Current Price Card -->
            <div class="bg-white rounded-lg shadow-md p-6 card-hover">
                <div class="flex items-center justify-between">
                    <div>
                        <p class="text-gray-600 text-sm font-medium">Current Price</p>
                        <p class="text-2xl font-bold text-gray-900" id="current-price">$0.00</p>
                    </div>
                    <i class="fas fa-dollar-sign text-green-500 text-2xl"></i>
                </div>
                <div class="mt-2">
                    <span class="text-sm" id="price-change">+0.00%</span>
                </div>
            </div>

            <!-- 24h Volume Card -->
            <div class="bg-white rounded-lg shadow-md p-6 card-hover">
                <div class="flex items-center justify-between">
                    <div>
                        <p class="text-gray-600 text-sm font-medium">24h Volume</p>
                        <p class="text-2xl font-bold text-gray-900" id="volume-24h">0</p>
                    </div>
                    <i class="fas fa-chart-bar text-blue-500 text-2xl"></i>
                </div>
            </div>

            <!-- Total Backtests Card -->
            <div class="bg-white rounded-lg shadow-md p-6 card-hover">
                <div class="flex items-center justify-between">
                    <div>
                        <p class="text-gray-600 text-sm font-medium">Total Backtests</p>
                        <p class="text-2xl font-bold text-gray-900" id="total-backtests">0</p>
                    </div>
                    <i class="fas fa-calculator text-purple-500 text-2xl"></i>
                </div>
            </div>

            <!-- Best Return Card -->
            <div class="bg-white rounded-lg shadow-md p-6 card-hover">
                <div class="flex items-center justify-between">
                    <div>
                        <p class="text-gray-600 text-sm font-medium">Best Return</p>
                        <p class="text-2xl font-bold text-gray-900" id="best-return">0.00%</p>
                    </div>
                    <i class="fas fa-trophy text-yellow-500 text-2xl"></i>
                </div>
            </div>
        </div>

        <!-- Charts Section -->
        <div class="grid grid-cols-1 lg:grid-cols-2 gap-6 mb-8">
            <!-- Real-time Price Chart -->
            <div class="bg-white rounded-lg shadow-md p-6">
                <h3 class="text-lg font-semibold text-gray-900 mb-4">
                    <i class="fas fa-chart-line mr-2"></i>Real-time Price
                </h3>
                <div id="price-chart" style="height: 300px;"></div>
            </div>

            <!-- Historical Data Chart -->
            <div class="bg-white rounded-lg shadow-md p-6">
                <h3 class="text-lg font-semibold text-gray-900 mb-4">
                    <i class="fas fa-history mr-2"></i>Historical Data
                </h3>
                <div id="historical-chart" style="height: 300px;"></div>
            </div>
        </div>

        <!-- Backtesting Section -->
        <div class="bg-white rounded-lg shadow-md p-6 mb-8">
            <h3 class="text-lg font-semibold text-gray-900 mb-4">
                <i class="fas fa-calculator mr-2"></i>Backtesting
            </h3>
            
            <!-- Backtest Controls -->
            <div class="grid grid-cols-1 md:grid-cols-4 gap-4 mb-6">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">Product</label>
                    <select id="backtest-product" class="w-full border border-gray-300 rounded-md px-3 py-2">
                        <option value="BTC-USD">BTC-USD</option>
                        <option value="ETH-USD">ETH-USD</option>
                        <option value="ADA-USD">ADA-USD</option>
                    </select>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">Days</label>
                    <select id="backtest-days" class="w-full border border-gray-300 rounded-md px-3 py-2">
                        <option value="3">3 days</option>
                        <option value="7" selected>7 days</option>
                        <option value="14">14 days</option>
                        <option value="30">30 days</option>
                    </select>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">Short Window</label>
                    <input type="number" id="short-window" value="5" min="2" max="50" 
                           class="w-full border border-gray-300 rounded-md px-3 py-2">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">Long Window</label>
                    <input type="number" id="long-window" value="20" min="5" max="100" 
                           class="w-full border border-gray-300 rounded-md px-3 py-2">
                </div>
            </div>
            
            <button id="run-backtest" 
                    class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded-lg transition duration-200">
                <i class="fas fa-play mr-2"></i>Run Backtest
            </button>

            <!-- Backtest Results -->
            <div id="backtest-results" class="mt-6 hidden">
                <h4 class="text-md font-semibold text-gray-900 mb-4">Results</h4>
                <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-4">
                    <div class="bg-gray-50 rounded-lg p-4">
                        <p class="text-sm text-gray-600">Total Return</p>
                        <p class="text-xl font-bold" id="backtest-return">0.00%</p>
                    </div>
                    <div class="bg-gray-50 rounded-lg p-4">
                        <p class="text-sm text-gray-600">Win Rate</p>
                        <p class="text-xl font-bold" id="backtest-win-rate">0.00%</p>
                    </div>
                    <div class="bg-gray-50 rounded-lg p-4">
                        <p class="text-sm text-gray-600">Total Trades</p>
                        <p class="text-xl font-bold" id="backtest-trades">0</p>
                    </div>
                </div>
                <div id="backtest-chart" style="height: 300px;"></div>
            </div>
        </div>

        <!-- Trading Metrics Table -->
        <div class="bg-white rounded-lg shadow-md p-6">
            <h3 class="text-lg font-semibold text-gray-900 mb-4">
                <i class="fas fa-table mr-2"></i>Trading Metrics
            </h3>
            <div class="overflow-x-auto">
                <table class="min-w-full divide-y divide-gray-200">
                    <thead class="bg-gray-50">
                        <tr>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Metric</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Value</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Status</th>
                        </tr>
                    </thead>
                    <tbody class="bg-white divide-y divide-gray-200" id="metrics-table">
                        <!-- Metrics will be populated by JavaScript -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Loading Overlay -->
    <div id="loading-overlay" class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center hidden">
        <div class="bg-white rounded-lg p-6 text-center">
            <div class="animate-spin rounded-full h-12 w-12 border-b-2 border-blue-600 mx-auto mb-4"></div>
            <p class="text-gray-700">Running backtest...</p>
        </div>
    </div>

    <script src="/static/js/dashboard.js"></script>
</body>
</html>
